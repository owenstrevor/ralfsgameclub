<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play & Visit — Ralf's Game Club</title><link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="subpage-brand.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet"><style>:root{--o:#ff5400;--bg:#0b0b0b;--paper:#f5f2eb;--line:#38332f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:"DM Sans",sans-serif}a{color:inherit;text-decoration:none}.top{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,5vw,70px);border-bottom:1px solid var(--line)}.top img{width:72px;height:72px}.top nav{display:flex;gap:20px;font-weight:700}.hero{padding:80px clamp(20px,6vw,90px) 55px}.eyebrow{color:var(--o);font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{font:500 clamp(4rem,10vw,9rem)/.88 Oswald,sans-serif;text-transform:uppercase;margin:14px 0}.intro{max-width:680px;color:#aaa;line-height:1.6}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.filter,.add{border:1px solid var(--line);border-radius:999px;background:#171412;color:#ddd;padding:11px 15px;font-weight:700;cursor:pointer}.filter.active,.add{background:var(--o);color:#111;border-color:var(--o)}.grid{padding:0 clamp(20px,6vw,90px) 90px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.item{min-height:250px;border:1px solid var(--line);border-radius:18px;background:#171412;overflow:hidden}.media{height:150px;background:#23201d;display:grid;place-items:center;color:#777;font-size:2.2rem}.media img,.media video{width:100%;height:100%;object-fit:cover}.body{padding:18px}.body small{color:var(--o);font-weight:700;text-transform:uppercase}.body h2{font:500 1.65rem Oswald,sans-serif;text-transform:uppercase;margin:8px 0}.body p{color:#999;margin:0;line-height:1.45}.empty{grid-column:1/-1;padding:55px;border:1px dashed #48413c;border-radius:18px;text-align:center;color:#888}dialog{width:min(520px,calc(100% - 30px));border:1px solid var(--line);border-radius:18px;background:#171412;color:white;padding:25px}dialog::backdrop{background:#000a}.form{display:grid;gap:14px}.form label{display:grid;gap:6px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #4a4540;border-radius:8px;background:#0e0d0c;color:white;font:inherit}.actions{display:flex;gap:10px;justify-content:flex-end}.actions button{padding:11px 15px;border:0;border-radius:8px;font-weight:700}.save{background:var(--o)}@media(max-width:760px){.top nav{display:none}.grid{grid-template-columns:1fr}.hero{padding-top:55px}}</style></head><body><header class="subpage-bar"><a class="subpage-logo" href="index.html" aria-label="Return to Ralf's Game Club home"><img src="assets/images/Ralfs Game Club Logo.svg" alt="Ralf's Game Club"></a></header><main><section class="hero"><div class="eyebrow">Play, explore, discover</div><h1>Inside<br>Ralf's</h1><p class="intro">Browse the games, equipment, books, and spaces available at the club. Use Manage Collection on the club's management browser to add photos, videos, and collection names.</p><div class="toolbar" id="filters"><button class="filter active" data-filter="All">All</button><button class="filter" data-filter="Board Games">Board Games</button><button class="filter" data-filter="Retro Games">Retro Games</button><button class="filter" data-filter="Nintendo Switch">Nintendo Switch</button><button class="filter" data-filter="Projector">Projector</button><button class="filter" data-filter="Books">Books</button><button class="filter" data-filter="Card Games">Card Games</button><button class="filter" data-filter="Spaces">Club Spaces</button><button class="add" onclick="addDialog.showModal()">＋ Add collection</button></div></section><section class="grid" id="grid"></section></main><dialog id="addDialog"><form class="form" id="addForm"><h2>Add to the collection</h2><label>Name<input name="name" required></label><label>Category<select name="category"><option>Board Games</option><option>Retro Games</option><option>Nintendo Switch</option><option>Projector</option><option>Books</option><option>Card Games</option><option>Spaces</option></select></label><label>Photo or short video<input name="media" type="file" accept="image/*,video/*"></label><label>Notes<textarea name="notes" rows="3"></textarea></label><div class="actions"><button type="button" onclick="addDialog.close()">Cancel</button><button class="save" type="submit">Save item</button></div></form></dialog><script>const seed=[{name:'Board Game Collection',category:'Board Games',notes:'Explore the club shelf and discover a new favorite.'},{name:'Retro Game Station',category:'Retro Games',notes:'Classic games for nostalgic play.'},{name:'Nintendo Switch',category:'Nintendo Switch',notes:'Multiplayer games for groups.'},{name:'Big-Screen Projector',category:'Projector',notes:'Movies, presentations, and tournaments.'},{name:'Community Library',category:'Books',notes:'Books for learning and relaxing.'},{name:'Card Game Collection',category:'Card Games',notes:'Decks and card games for every table.'}];let items=JSON.parse(localStorage.getItem('ralfsCollection')||'null')||seed,filter='All';const grid=document.getElementById('grid');function draw(){const list=items.filter(x=>filter==='All'||x.category===filter);grid.innerHTML=list.length?list.map(x=>`<article class="item"><div class="media">${x.media?x.media.startsWith('data:video')?`<video controls src="${x.media}"></video>`:`<img src="${x.media}" alt="">`:'＋'}</div><div class="body"><small>${x.category}</small><h2>${x.name}</h2><p>${x.notes||''}</p></div></article>`).join(''):'<div class="empty">No items in this category yet. Use “＋ Add collection” to add the first one.</div>'}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));draw()});addForm.onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),file=f.get('media'),save=media=>{items.push({name:f.get('name'),category:f.get('category'),notes:f.get('notes'),media});localStorage.setItem('ralfsCollection',JSON.stringify(items));draw();e.target.reset();addDialog.close()};if(file&&file.size){const r=new FileReader;r.onload=()=>save(r.result);r.readAsDataURL(file)}else save('')};draw()</script></body></html>
