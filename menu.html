<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Food &amp; Drinks — Ralf's Game Club</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="subpage-brand.css">
  <link rel="stylesheet" href="site-header.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--o:#ff5400;--ink:#111;--paper:#f6f4ef;--line:#d7d2cb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif}.hero{padding:70px clamp(20px,6vw,90px) 35px}.eyebrow{color:var(--o);font-weight:700;letter-spacing:.17em;text-transform:uppercase}h1{font:500 clamp(4rem,9vw,8rem)/.9 Oswald,sans-serif;text-transform:uppercase;margin:12px 0}.hero p{color:#666;max-width:620px}.menu{margin:0 clamp(20px,6vw,90px) 80px;padding:clamp(25px,4vw,50px);border:1px solid var(--line);border-radius:26px;background:white;box-shadow:0 18px 45px #00000012;display:grid;grid-template-columns:repeat(2,1fr);gap:50px}.section h2{font:500 2.5rem Oswald,sans-serif;margin:0 0 22px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;margin:15px 0}.dots{border-bottom:1px solid var(--line)}.item strong{font-size:1rem}.item span{font-weight:700}.item small{grid-column:1/-1;color:#777}.manage{position:fixed;right:22px;bottom:22px;border:0;border-radius:999px;background:var(--o);color:#111;padding:14px 18px;font-weight:800;box-shadow:0 7px 0 #a93600;cursor:pointer}dialog{width:min(480px,calc(100% - 30px));border:1px solid var(--line);border-radius:18px;padding:24px}.form{display:grid;gap:13px}.form label{display:grid;gap:6px;font-weight:700}.form input,.form select{padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}.actions{display:flex;justify-content:flex-end;gap:8px}.actions button{padding:10px 14px;border:0;border-radius:8px}.save{background:var(--o);font-weight:700}@media(max-width:720px){.menu{grid-template-columns:1fr;gap:28px}}
  </style>
  <script src="site-header.js" defer></script>
</head>
<body>
  <header class="subpage-bar"><a class="subpage-logo" href="index.html" aria-label="Return to Ralf's Game Club home"><img src="assets/images/Ralfs Game Club Logo.svg" alt="Ralf's Game Club"></a></header>
  <main>
    <section class="hero"><div class="eyebrow">Ralf's kitchen counter</div><h1>Food &amp;<br>Drinks</h1><p>Simple comfort food and community drinks made for game time.</p></section>
    <section class="menu"><div class="section" id="food"><h2>Food</h2><div id="foodItems"></div></div><div class="section" id="drinks"><h2>Drinks</h2><div id="drinkItems"></div></div></section>
  </main>
  <button class="manage" onclick="menuDialog.showModal()">＋ Add menu item</button>
  <dialog id="menuDialog"><form class="form" id="menuForm"><h2>Add menu item</h2><label>Name<input name="name" required></label><label>Category<select name="category"><option>Food</option><option>Drinks</option></select></label><label>Price<input name="price" required placeholder="$5"></label><label>Options<input name="options" placeholder="Optional sides or flavors"></label><div class="actions"><button type="button" onclick="menuDialog.close()">Cancel</button><button class="save" type="submit">Save item</button></div></form></dialog>
  <script>
    const defaults=[{name:'Grilled Cheese Sandwich',category:'Food',price:'$7',options:'Add egg or ham +$1'},{name:'Pizza Slice',category:'Food',price:'$3',options:''},{name:'Beef Protein Bowl',category:'Food',price:'$15',options:''},{name:'Hot Cup Noodles',category:'Food',price:'$5',options:'Add egg or beef +$1'},{name:'Community Coffee',category:'Drinks',price:'$2',options:'Refills included'},{name:'Hot Brown Sugar Lemon Tea',category:'Drinks',price:'$4',options:'French vanilla milk option available'}];
    let items=JSON.parse(localStorage.getItem('ralfsMenu')||'null')||defaults;
    function draw(){for(const cat of ['Food','Drinks'])document.getElementById(cat==='Food'?'foodItems':'drinkItems').innerHTML=items.filter(x=>x.category===cat).map(x=>`<div class="item"><strong>${x.name}</strong><i class="dots"></i><span>${x.price}</span>${x.options?`<small>${x.options}</small>`:''}</div>`).join('')}
    menuForm.onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);items.push({name:f.get('name'),category:f.get('category'),price:f.get('price'),options:f.get('options')});localStorage.setItem('ralfsMenu',JSON.stringify(items));draw();e.target.reset();menuDialog.close()};draw();
  </script>
</body>
</html>
