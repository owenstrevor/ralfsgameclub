<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weekly Community Meetups — Ralf's Game Club</title>
  <meta name="description" content="Weekly chess, board game, and world language meetups at Ralf's Game Club in Santurce, Puerto Rico.">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="subpage-brand.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--o:#ff5400;--ink:#0b0b0b;--paper:#f5f2eb;--line:#2c2c2c}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:"DM Sans",sans-serif}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:5;background:#f6f5f1;color:#111;display:flex;align-items:center;gap:22px;padding:10px clamp(16px,5vw,64px);border-top:3px solid var(--o);border-bottom:1px solid #d7d4ce}.logo{width:58px;height:65px;object-fit:contain}.links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.links a{font-weight:800;padding:9px 11px;border-radius:999px}.links a:hover{background:var(--o)}select{margin-left:auto;border:2px solid #111;border-radius:10px;padding:9px;background:#fff;font-weight:800}.hero{padding:80px clamp(20px,6vw,90px) 55px;background:radial-gradient(circle at 85% 20%,#481b0a,transparent 30%),linear-gradient(90deg,#0b0b0b,#17100d)}.eyebrow{color:var(--o);font-weight:900;letter-spacing:.2em;text-transform:uppercase}.hero h1{font:600 clamp(3.4rem,9vw,8rem)/.9 "Oswald",sans-serif;text-transform:uppercase;margin:18px 0}.hero p{max-width:720px;color:#c3bfba;font-size:1.1rem;line-height:1.6}.events{padding:28px clamp(16px,5vw,72px) 90px}.event{border:1px solid var(--line);border-radius:24px;overflow:hidden;margin:28px auto;background:#141414;max-width:1220px}.event-copy{padding:clamp(24px,4vw,48px)}.day{color:var(--o);font-weight:900;text-transform:uppercase;letter-spacing:.16em}.event h2{font:600 clamp(2.4rem,6vw,5.2rem)/.95 "Oswald",sans-serif;text-transform:uppercase;margin:12px 0 14px}.meta{font-weight:800;margin-bottom:18px}.desc{max-width:900px;color:#bbb;line-height:1.7}.track-window{overflow:hidden;border-top:1px solid var(--line);background:#0c0c0c}.track{width:max-content;display:flex;gap:14px;padding:16px;animation:moveRight 26s linear infinite;transform:translateX(-50%)}.track-window:hover .track{animation-play-state:paused}.slide{width:280px;height:190px;border-radius:16px;overflow:hidden;border:1px solid #444;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#23120b,#0e0e0e)}.slide img{width:100%;height:100%;object-fit:cover}.slide.placeholder{color:#fff;text-align:center;font-weight:900;text-transform:uppercase;letter-spacing:.09em;padding:20px}.slide.placeholder::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 25%,rgba(255,84,0,.45),transparent 28%);pointer-events:none}.slide span{position:relative}.note{color:#817c77;font-size:.78rem;margin-top:12px}@keyframes moveRight{from{transform:translateX(-50%)}to{transform:translateX(0)}}@media(prefers-reduced-motion:reduce){.track{animation:none}}@media(max-width:760px){.top{align-items:flex-start;flex-wrap:wrap}.links{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}.links a{white-space:nowrap;border:1px solid #222;font-size:.72rem}.hero{padding-top:55px}.slide{width:220px;height:150px}}
  </style>
  <link rel="stylesheet" href="site-header.css">
  <script src="site-header.js?v=20260921-hide-menu" defer></script>
</head>
<body>
  <header class="subpage-bar"><a class="subpage-logo" href="index.html" aria-label="Return to Ralf's Game Club home"><img src="assets/images/Ralfs Game Club Logo.svg" alt="Ralf's Game Club"></a><select class="subpage-tools" id="lang" aria-label="Language"><option value="en">English</option><option value="es">Español</option></select></header>
  <main><section class="hero"><div class="eyebrow" data-en="Free weekly community events" data-es="Eventos comunitarios semanales gratuitos">Free weekly community events</div><h1 data-en="Come find your table." data-es="Ven y encuentra tu mesa.">Come find your table.</h1><p data-en="No ticket required. Come solo or bring friends—beginners, regulars, and curious neighbors are all welcome." data-es="No necesitas boleto. Ven solo o trae amigos; principiantes, habituales y vecinos curiosos son bienvenidos.">No ticket required. Come solo or bring friends—beginners, regulars, and curious neighbors are all welcome.</p></section><section class="events" id="events"></section></main>
  <script>
    const events=[
      {day:'Every Wednesday',dayEs:'Todos los miércoles',title:'Weekly Chess Meet Up',titleEs:'Encuentro semanal de ajedrez',time:'6:00 PM–10:00 PM',icon:'♟️',desc:'Organized by San Juan Chess Club, a community partner of Ralf’s Game Club. Experienced players, learners, and anyone curious about chess are welcome for games, practice, and friendly competition.',descEs:'Organizado por San Juan Chess Club, socio comunitario de Ralf’s Game Club. Jugadores con experiencia, principiantes y curiosos son bienvenidos para jugar, practicar y competir amistosamente.'},
      {day:'Every Thursday',dayEs:'Todos los jueves',title:'Board Game Community Night',titleEs:'Noche comunitaria de juegos de mesa',time:'6:00 PM–10:00 PM',icon:'🎲',desc:'Meet new people, bring friends, or join a table on your own. Our community plays strategy games, party games, social games, and casual favorites. You’re welcome to bring a game and teach it to the community.',descEs:'Conoce gente nueva, trae amigos o únete a una mesa por tu cuenta. Jugamos estrategia, juegos de fiesta, juegos sociales y favoritos casuales. También puedes traer un juego y enseñarlo a la comunidad.'},
      {day:'Every Sunday',dayEs:'Todos los domingos',title:'World Languages Table',titleEs:'Mesa de idiomas del mundo',time:'3:00 PM–5:30 PM',icon:'🌍',desc:'A relaxed language exchange for practicing conversation, meeting new friends, and sharing cultures. Current tables include Mandarin Chinese, Spanish, French, and Portuguese. Beginners, intermediate learners, native speakers, and the simply curious are welcome.',descEs:'Un intercambio relajado para practicar conversación, conocer amistades y compartir culturas. Las mesas actuales incluyen chino mandarín, español, francés y portugués. Todos los niveles y personas curiosas son bienvenidos.'}
    ];
    const wrap=document.getElementById('events');let communityLanguage='';
    function render(lang){wrap.innerHTML=events.map((e,i)=>`<article class="event"><div class="event-copy"><div class="day">${lang==='es'?e.dayEs:e.day}</div><h2>${e.icon} ${lang==='es'?e.titleEs:e.title}</h2><div class="meta">${e.time} · Ralf's Game Club · Free / Gratis</div><div class="desc">${lang==='es'?e.descEs:e.desc}</div></div><div class="track-window" aria-label="Community photo carousel"><div class="track">${slides(e,i)}${slides(e,i)}</div></div><div class="event-copy note">Community photo carousel · Hover to pause · Photo-ready for future Google Maps uploads</div></article>`).join('')}
    function slides(e,i){return [1,2,3,4].map((n)=>`<div class="slide placeholder"><span>${e.icon}<br>${e.title}<br>Community moment ${n}</span></div>`).join('')}
    function setLang(lang){communityLanguage=lang;document.documentElement.lang=lang;localStorage.setItem('ralfsLanguage',lang);document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang]);const oldSelect=document.getElementById('lang');if(oldSelect)oldSelect.value=lang;render(lang)}
    document.getElementById('lang').addEventListener('change',e=>setLang(e.target.value));setLang(localStorage.getItem('ralfsLanguage')||'en');
    document.addEventListener('ralfs-language-change',e=>{if(e.detail.lang!==communityLanguage)setLang(e.detail.lang)});
  </script>
</body></html>
